- name: Sync Student DBs
  hosts: "{{ rhel_host | default('postgresql') }}"
  become: true
  gather_facts: false
  vars:
    roles_to_ignore:
      - "postgres"

  # Connect over TCP on loopback instead of the unix socket. pg_hba.conf uses
  # peer auth for local connections, which matches the OS user -- root, because
  # of become -- against the database user and ignores the password entirely,
  # so a socket connection as login_user can never succeed. 127.0.0.1 hits the
  # scram-sha-256 host rule that setup_postgres.yml lays down.
  module_defaults:
    group/community.postgresql.all:
      login_host: 127.0.0.1
      login_user: "{{ login_user }}"
      login_password: "{{ login_password }}"

  tasks:
  - name: Add needed student databases
    community.postgresql.postgresql_db:
      name: "db-{{ item }}"
      state: "present"
    with_items: "{{ students }}"

  - name: Add needed student users
    community.postgresql.postgresql_user:
      name: "{{ item }}"
      password: "{{ lookup('community.general.random_string', min_lower=1, min_upper=1, min_special=1, min_numeric=1) }}"
      state: "present"
      no_password_changes: true
    with_items: "{{ students }}"

  - name: Manage student privs
    community.postgresql.postgresql_privs:
      privs: ALL
      role: "{{ item }}"
      obj: ALL_IN_SCHEMA
      login_db: "db-{{ item }}"
    with_items: "{{ students }}"

  - name: Collect all info
    community.postgresql.postgresql_info:
      filter: "roles"
    register: postgres_info

  - name: Filter roles
    ansible.builtin.set_fact:
      roles_after_filter: "{{ postgres_info.roles | difference(roles_to_ignore) }}"

  - name: Determine diff
    ansible.builtin.set_fact:
      roles_to_remove: "{{ roles_after_filter | difference(students) }}"

  - name: Remove unneeded databases
    community.postgresql.postgresql_db:
      name: "db-{{ item }}"
      state: "absent"
      # DROP DATABASE refuses to run while anyone is connected, and an idle
      # pgAdmin or psql session is enough to block it. On PG13+ this becomes
      # DROP DATABASE ... WITH (FORCE), which disconnects those sessions first.
      force: true
    with_items: "{{ roles_to_remove }}"

  - name: Remove unneeded student users
    community.postgresql.postgresql_user:
      name: "{{ item }}"
      state: "absent"
    with_items: "{{ roles_to_remove }}"
